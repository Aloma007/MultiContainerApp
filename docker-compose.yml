version: '3.8'

services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      # This tells the API to connect to the 'mongo' service instead of localhost
      - MONGO_URI=mongodb://mongo:27017/tododb
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

# This defines the persistent storage for the database
volumes:
  mongo_data: